<svg width="480" height="360" viewBox="0 0 480 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="끝없이 움직이는 계단들">
  <defs>
    <clipPath id="clip"><rect x="0" y="0" width="480" height="360" rx="20" /></clipPath>
    <radialGradient id="bg" cx="50%" cy="40%" r="78%">
      <stop offset="0" stop-color="#2a2419" />
      <stop offset="0.55" stop-color="#171308" />
      <stop offset="1" stop-color="#0a0805" />
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="45%" r="72%">
      <stop offset="0.5" stop-color="#000" stop-opacity="0" />
      <stop offset="1" stop-color="#000" stop-opacity="0.6" />
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="42%">
      <stop offset="0" stop-color="#e8c98f" stop-opacity="0.14" />
      <stop offset="1" stop-color="#e8c98f" stop-opacity="0" />
    </radialGradient>
    <symbol id="s" overflow="visible">
      <path d="M0,0 44,0 44,30 0,30Z" fill="#6d6656" stroke="#191509" stroke-width="1.2" stroke-linejoin="round" />
      <path d="M0,0 44,0 66,-14 22,-14Z" fill="#cbc3ad" stroke="#191509" stroke-width="1.2" stroke-linejoin="round" />
    </symbol>
    <g id="flight">
      <use href="#s" x="528" y="-360" /><use href="#s" x="484" y="-330" /><use href="#s" x="440" y="-300" />
      <use href="#s" x="396" y="-270" /><use href="#s" x="352" y="-240" /><use href="#s" x="308" y="-210" />
      <use href="#s" x="264" y="-180" /><use href="#s" x="220" y="-150" /><use href="#s" x="176" y="-120" />
      <use href="#s" x="132" y="-90" /><use href="#s" x="88" y="-60" /><use href="#s" x="44" y="-30" />
      <use href="#s" x="0" y="0" /><use href="#s" x="-44" y="30" /><use href="#s" x="-88" y="60" />
      <use href="#s" x="-132" y="90" /><use href="#s" x="-176" y="120" /><use href="#s" x="-220" y="150" />
      <use href="#s" x="-264" y="180" />
    </g>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="480" height="360" fill="url(#bg)" />
    <rect width="480" height="360" fill="url(#glow)" />

    <!-- far flight, up-left, dim -->
    <g transform="translate(88,128) rotate(-26) scale(0.66)" opacity="0.42">
      <g><animateTransform attributeName="transform" type="translate" from="0 0" to="44 -30" dur="8s" repeatCount="indefinite" /><use href="#flight" /></g>
    </g>
    <!-- descending flight, other direction -->
    <g transform="translate(452,86) rotate(198) scale(0.8)" opacity="0.55">
      <g><animateTransform attributeName="transform" type="translate" from="0 0" to="44 -30" dur="7s" repeatCount="indefinite" /><use href="#flight" /></g>
    </g>
    <!-- upper-right flight -->
    <g transform="translate(300,120) rotate(16) scale(0.82)" opacity="0.72">
      <g><animateTransform attributeName="transform" type="translate" from="0 0" to="44 -30" dur="6.2s" repeatCount="indefinite" /><use href="#flight" /></g>
    </g>
    <!-- steep crossing flight -->
    <g transform="translate(210,340) rotate(-56) scale(0.7)" opacity="0.6">
      <g><animateTransform attributeName="transform" type="translate" from="0 0" to="44 -30" dur="6.6s" repeatCount="indefinite" /><use href="#flight" /></g>
    </g>
    <!-- main flight, front and large -->
    <g transform="translate(150,306) rotate(3) scale(1.12)">
      <g><animateTransform attributeName="transform" type="translate" from="0 0" to="44 -30" dur="5s" repeatCount="indefinite" /><use href="#flight" /></g>
    </g>

    <rect width="480" height="360" fill="url(#vig)" />
  </g>
</svg>
